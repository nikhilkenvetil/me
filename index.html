<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikhil Kenvetil - Senior Software Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --card-gradient: linear-gradient(145deg, #ffffff 0%, #f8f9ff 100%);
            --primary-color: #667eea;
            --text-dark: #1a202c;
            --text-medium: #4a5568;
            --text-light: #718096;
            --bg-light: #f7fafc;
            --border-color: #e2e8f0;
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
            --shadow-xl: 0 20px 25px rgba(0,0,0,0.1);
            --transition: all 0.3s ease;
        }
        body { font-family: Inter, sans-serif; line-height: 1.7; color: var(--text-dark); background: linear-gradient(180deg, #f7fafc 0%, #edf2f7 100%); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        header { background: var(--primary-gradient); color: white; padding: 80px 0 60px; text-align: center; clip-path: ellipse(150% 100% at 50% 0%); position: relative; overflow: hidden; }
        header::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%); animation: pulse 15s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.5; } 50% { transform: scale(1.1) rotate(180deg); opacity: 0.8; } }
        header h1 { font-family: Poppins, sans-serif; font-size: 3.5rem; font-weight: 800; margin-bottom: 20px; animation: fadeInDown 0.8s ease-out; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        .contact-info { font-size: 1.05rem; animation: fadeInUp 0.8s ease-out 0.2s both; position: relative; z-index: 1; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .contact-info a { color: white; text-decoration: none; padding: 8px 16px; border-radius: 25px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); transition: var(--transition); }
        .contact-info a:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); }
        .contact-separator { margin: 0 12px; opacity: 0.7; }
        main { padding: 60px 0; }
        section { margin-bottom: 60px; animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .section-title { font-family: Poppins, sans-serif; font-size: 1.8rem; font-weight: 700; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding-bottom: 15px; margin-bottom: 30px; position: relative; display: inline-block; }
        .section-title::after { content: ""; position: absolute; bottom: 0; left: 0; width: 60px; height: 4px; background: var(--primary-gradient); border-radius: 2px; transition: width 0.3s ease; }
        section:hover .section-title::after { width: 100%; }
        .summary { background: var(--card-gradient); padding: 35px; border-radius: 20px; border-left: 5px solid transparent; border-image: var(--primary-gradient) 1; box-shadow: var(--shadow-lg); transition: var(--transition); }
        .summary:hover { transform: translateY(-5px); box-shadow: var(--shadow-xl); }
        .summary p { font-size: 1.1rem; line-height: 1.9; }
        .summary strong { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }
        .job { margin-bottom: 40px; padding-bottom: 40px; border-bottom: 1px solid var(--border-color); position: relative; }
        .job::before { content: ""; position: absolute; left: -30px; top: 0; width: 4px; height: 0; background: var(--primary-gradient); transition: height 0.4s ease; }
        .job:hover::before { height: 100%; }
        .job:last-child { border-bottom: none; }
        .job-header { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .job-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
        .company { font-size: 1.15rem; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 600; }
        .company a { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .job-date { font-style: italic; color: var(--text-light); background: var(--bg-light); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); }
        .job ul { list-style: none; padding-left: 0; }
        .job li { position: relative; padding-left: 30px; margin-bottom: 14px; line-height: 1.8; color: var(--text-medium); transition: var(--transition); }
        .job li:hover { color: var(--text-dark); transform: translateX(5px); }
        .job li::before { content: ">"; position: absolute; left: 0; color: var(--primary-color); font-weight: bold; font-size: 1.2rem; }
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 25px; }
        .project { background: var(--card-gradient); padding: 30px; border-radius: 20px; box-shadow: var(--shadow-lg); transition: var(--transition); border: 1px solid var(--border-color); position: relative; overflow: hidden; }
        .project::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent-gradient); transform: scaleX(0); transition: transform 0.4s ease; }
        .project:hover::before { transform: scaleX(1); }
        .project:hover { transform: translateY(-8px); box-shadow: var(--shadow-xl); border-color: var(--primary-color); }
        .project-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 15px; }
        .project-title::before { content: "🚀 "; }
        .project p { margin-bottom: 18px; line-height: 1.8; color: var(--text-medium); }
        .project ul { list-style: none; padding-left: 0; }
        .project li { position: relative; padding-left: 30px; margin-bottom: 12px; line-height: 1.7; color: var(--text-medium); }
        .project li::before { content: "✓"; position: absolute; left: 0; color: white; background: var(--accent-gradient); width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; }
        .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }
        .skill-card { background: var(--card-gradient); padding: 28px; border-radius: 18px; box-shadow: var(--shadow-lg); transition: var(--transition); border: 1px solid var(--border-color); }
        .skill-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-xl); border-color: var(--primary-color); }
        .skill-title { font-size: 1.2rem; font-weight: 700; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px; }
        .education-item { padding: 20px 25px; border-radius: 12px; background: var(--card-gradient); margin-bottom: 15px; transition: var(--transition); border-left: 4px solid transparent; }
        .education-item:hover { border-left-color: var(--primary-color); transform: translateX(8px); }
        .certifications-list { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .certifications-list li { padding: 18px 22px; background: var(--card-gradient); border-radius: 12px; transition: var(--transition); border: 1px solid var(--border-color); }
        .certifications-list li:hover { transform: translateY(-4px); border-color: var(--primary-color); }
        .certifications-list strong { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        footer { background: var(--text-dark); color: white; text-align: center; padding: 40px 0; margin-top: 80px; }
        @media (max-width: 768px) { header { padding: 60px 0 40px; clip-path: ellipse(180% 100% at 50% 0%); } header h1 { font-size: 2.2rem; } .contact-info { font-size: 0.9rem; } .contact-separator { display: block; margin: 8px 0; } .skills-grid, .projects-grid, .certifications-list { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
